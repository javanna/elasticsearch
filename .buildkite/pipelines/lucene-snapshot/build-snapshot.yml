# TARGET_BRANCH unset: legacy upload + push on the pipeline branch (10.6 schedule
# is paused). TARGET_BRANCH set (lucene_snapshot or lucene_snapshot_11): S3 only,
# then Archimedes. That path defaults Lucene to branch_11x / JDK 25 — 10.6 is
# released; lucene_snapshot will retarget to 11 and replace lucene_snapshot_11.
env:
  TARGET_BRANCH: "${TARGET_BRANCH:-}"
  LUCENE_BUILD_ID: "${LUCENE_BUILD_ID:-}"

steps:
  - trigger: apache-lucene-build-snapshot
    label: Trigger pipeline to build lucene snapshot
    key: lucene-build
    if: (build.env("LUCENE_BUILD_ID") == null || build.env("LUCENE_BUILD_ID") == "") && (build.env("TARGET_BRANCH") == null || build.env("TARGET_BRANCH") == "")
    build:
      branch: "${LUCENE_BRANCH:-branch_10_6}"
      env:
        JDK_VERSION: "${LUCENE_JDK_VERSION:-21}"
  - trigger: apache-lucene-build-snapshot
    label: Trigger pipeline to build lucene snapshot for lucene_snapshot_*
    key: lucene-build-target
    if: (build.env("LUCENE_BUILD_ID") == null || build.env("LUCENE_BUILD_ID") == "") && build.env("TARGET_BRANCH") != null && build.env("TARGET_BRANCH") != ""
    build:
      branch: "${LUCENE_BRANCH:-branch_11x}"
      env:
        JDK_VERSION: "${LUCENE_JDK_VERSION:-25}"
  - wait
  - label: Upload and update lucene snapshot
    command: .buildkite/scripts/lucene-snapshot/upload-snapshot.sh
    timeout_in_minutes: 15
    env:
      USE_LUCENE_SNAPSHOT_CREDS: "true"
      UPDATE_ES_LUCENE_SNAPSHOT: "true"
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      machineType: custom-32-98304
      buildDirectory: /dev/shm/bk
  - wait
  - trigger: "elasticsearch-lucene-snapshot-tests"
    if: build.env("TARGET_BRANCH") == null || build.env("TARGET_BRANCH") == ""
    build:
      branch: "${BUILDKITE_BRANCH}"
    async: true

  - label: ":robot_face: trigger lucene-snapshot-update"
    if: build.env("TARGET_BRANCH") != null && build.env("TARGET_BRANCH") != ""
    command: .buildkite/scripts/lucene-snapshot/trigger-snapshot-update.sh
    timeout_in_minutes: 5
